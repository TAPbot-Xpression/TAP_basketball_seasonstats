name: Scrape Basketball Stats

on:
  schedule:
    # Runs every 6 hours (4x per day) — ensures away team is scraped within 24h of URL update
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "away_team_config.json"  # Also triggers when away team URL is updated
  workflow_dispatch:             # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write  # Required to commit stats.json back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the repo ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Cache pip dependencies ──────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 5. Run the scraper ─────────────────────────────────────────────────
      - name: Run scraper
        run: python scraper.py

      # ── 6. Commit updated files back to repo ──────────────────────────────
      - name: Commit and push updated stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/stats.json away_team_config.json
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore: update stats [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
