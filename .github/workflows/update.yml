name: Scrape Basketball Stats

on:
  schedule:
    # Daily 9am UTC scan
    - cron: "0 9 * * *"

  push:
    branches:
      - main

  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write   # Required to commit JSON files back to the repo
  pages: write      # Required to deploy to GitHub Pages
  id-token: write   # Required for Pages OIDC authentication

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the repo ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Cache pip dependencies ──────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 5. Run the basketball scraper ──────────────────────────────────────
      - name: Run scraper
        run: python scrape_basketball.py

      # ── 6. Move JSON output files into docs/ for Pages serving ─────────────
      - name: Move JSON files to docs/
        run: |
          mkdir -p docs
          mv all_teams.json docs/all_teams.json
          # Move each individual team JSON into docs/
          for f in kansas_city.json north_dakota.json north_dakota_state.json \
                   omaha.json oral_roberts.json south_dakota.json \
                   south_dakota_state.json st_thomas.json; do
            [ -f "$f" ] && mv "$f" "docs/$f" || echo "Warning: $f not found, skipping"
          done

      # ── 7. Commit updated JSON files back to repo ──────────────────────────
      - name: Commit and push updated stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/all_teams.json \
                  docs/kansas_city.json \
                  docs/north_dakota.json \
                  docs/north_dakota_state.json \
                  docs/omaha.json \
                  docs/oral_roberts.json \
                  docs/south_dakota.json \
                  docs/south_dakota_state.json \
                  docs/st_thomas.json
          git diff --cached --quiet || git commit -m "chore: update basketball stats [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      # ── 8. Upload docs/ folder as Pages artifact ───────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/   # Uploads everything in docs/ (index.html + all JSON files)

  deploy:
    runs-on: ubuntu-latest
    needs: scrape   # Only runs after scrape job completes successfully

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── 9. Deploy to GitHub Pages ──────────────────────────────────────────
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
