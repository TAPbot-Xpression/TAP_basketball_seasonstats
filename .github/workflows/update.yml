name: Scrape Basketball Stats

on:
  schedule:
    # Daily at 9:00 AM UTC
    - cron: "0 9 * * *"
  push:
    branches:
      - main
  workflow_dispatch: # Manual run from the GitHub Actions tab (with Non-Conf link fields)
    inputs:
      men_team_name:
        description: "MEN'S Non-Conf - team name (optional, auto-detected if blank)"
        required: false
        default: ""
        type: string
      men_stats_url:
        description: "MEN'S Non-Conf - stats page link (type 'clear' to empty this slot)"
        required: false
        default: ""
        type: string
      men_roster_url:
        description: "MEN'S Non-Conf - roster link (optional, auto-found if blank)"
        required: false
        default: ""
        type: string
      women_team_name:
        description: "WOMEN'S Non-Conf - team name (optional, auto-detected if blank)"
        required: false
        default: ""
        type: string
      women_stats_url:
        description: "WOMEN'S Non-Conf - stats page link (type 'clear' to empty this slot)"
        required: false
        default: ""
        type: string
      women_roster_url:
        description: "WOMEN'S Non-Conf - roster link (optional, auto-found if blank)"
        required: false
        default: ""
        type: string

permissions:
  contents: write   # Required to commit JSON files back to the repo
  pages: write      # Required to deploy to GitHub Pages
  id-token: write   # Required for Pages OIDC authentication

# Prevents two runs (e.g. a push and the daily schedule) from colliding
concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── 1. Check out the repo ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Cache pip dependencies ──────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4b. Install Playwright browser (fast) ──────────────────────────────
      # Downloads only the small headless browser (no slow apt/font packages).
      # If it can't launch because of missing system libraries, it falls back
      # to the full --with-deps install automatically.
      - name: Install Playwright browser
        run: |
          playwright install chromium-headless-shell
          python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); b.close(); p.stop()" \
            || playwright install --with-deps chromium-headless-shell

      # ── 4c. Save Non-Conf links (only when typed into the Run workflow form)
      # The links are stored in non_conf_config.json so the daily 9 AM run keeps
      # refreshing the same Non-Conf opponent until you replace or clear it.
      - name: Update Non-Conf config
        env:
          MEN_NAME: ${{ inputs.men_team_name }}
          MEN_STATS: ${{ inputs.men_stats_url }}
          MEN_ROSTER: ${{ inputs.men_roster_url }}
          WOMEN_NAME: ${{ inputs.women_team_name }}
          WOMEN_STATS: ${{ inputs.women_stats_url }}
          WOMEN_ROSTER: ${{ inputs.women_roster_url }}
        run: |
          python - <<'PY'
          import json, os, sys

          PATH = "non_conf_config.json"
          EMPTY = {"name": "", "stats_url": "", "roster_url": ""}

          try:
              with open(PATH, encoding="utf-8") as f:
                  cfg = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              cfg = {}

          for gender in ("men", "women"):
              entry = cfg.get(gender) if isinstance(cfg.get(gender), dict) else {}
              cfg[gender] = {k: str(entry.get(k, "") or "") for k in EMPTY}

          def env(key):
              return (os.environ.get(key) or "").strip()

          for gender, prefix in (("men", "MEN"), ("women", "WOMEN")):
              name = env(prefix + "_NAME")
              stats = env(prefix + "_STATS")
              roster = env(prefix + "_ROSTER")

              if not stats:
                  continue  # nothing typed for this slot -> keep what is saved

              if stats.lower() == "clear":
                  cfg[gender] = dict(EMPTY)
                  print(f"Cleared {gender} Non-Conf slot")
                  continue

              for label, url in (("stats", stats), ("roster", roster)):
                  if url and not url.startswith(("http://", "https://")):
                      sys.exit(f"{gender} {label} link must start with http:// or https://")

              cfg[gender] = {"name": name, "stats_url": stats, "roster_url": roster}
              print(f"Saved {gender} Non-Conf link: {stats}")

          with open(PATH, "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          PY

      # ── 5. Run the unified basketball scraper (Conference + Non-Conf) ─────
      - name: Run basketball scraper
        run: python scrape_basketball.py

      # ── 6. Commit all updated JSON files back to repo ─────────────────────
      - name: Commit and push updated stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.json non_conf_config.json
          git diff --cached --quiet || git commit -m "chore: update Men's and Women's basketball stats [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      # ── 7. Upload docs/ folder as Pages artifact ──────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      # ── 8. Deploy to GitHub Pages ──────────────────────────────────────────
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
